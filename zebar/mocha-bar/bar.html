<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
  </head>
  <body>
    <div class="bar">
      <div class="left">
        <div id="workspaces" class="workspaces"></div>
      </div>

      <div class="center">
        <button id="clock" class="pill clock"></button>
      </div>

      <div class="right">
        <div id="vpn" class="pill vpn" hidden>
          <span class="vpn-list"></span>
          <button class="vpn-toggle" title="VPN"></button>
        </div>
        <div class="pill status">
          <button id="volume" class="volume" hidden></button>
          <div id="battery" class="battery" hidden></div>
        </div>
        <div id="power" class="pill power">
          <span class="power-actions">
            <button data-action="suspend" title="Suspend">&#xF0904;</button>
            <button data-action="hibernate" title="Hibernate">&#xF02CA;</button>
            <button data-action="shutdown" title="Shutdown">&#xF0425;</button>
            <button data-action="reboot" title="Reboot">&#xF0709;</button>
          </span>
          <button title="Power">&#xF0906;</button>
        </div>
      </div>
    </div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.3.1';

      const $ = id => document.getElementById(id);
      const pad = n => String(n).padStart(2, '0');

      // Workspaces on this monitor: numbers 1-9, a dot for the rest.
      const glazewm = zebar.createProvider({ type: 'glazewm' });
      glazewm.onOutput(wm => {
        $('workspaces').replaceChildren(
          ...wm.currentWorkspaces.map(ws => {
            const button = document.createElement('button');
            button.className = ws.isDisplayed ? 'workspace active' : 'workspace';
            button.textContent = ` ${/^[1-9]$/.test(ws.name) ? ws.name : '\u{EA71}'} `;
            button.onclick = () => wm.runCommand(`focus --workspace ${ws.name}`);
            return button;
          }),
        );
      });

      // Clock: click toggles between time and date, like format-alt.
      const date = zebar.createProvider({ type: 'date' });
      let showDate = false;
      function renderClock() {
        if (!date.output) return;
        const d = new Date(date.output.now);
        $('clock').textContent = showDate
          ? `\u{EAB0}  ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`
          : `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }
      date.onOutput(renderClock);
      $('clock').onclick = () => {
        showDate = !showDate;
        renderClock();
      };

      // Volume (wireplumber): scroll changes by 1%, click toggles mute.
      const audio = zebar.createProvider({ type: 'audio' });
      const volumeIcons = ['\u{F0580}', '\u{F057E}', '\u{F028}'];
      audio.onOutput(({ defaultPlaybackDevice: dev }) => {
        const el = $('volume');
        el.hidden = !dev;
        if (!dev) return;
        const glyph = /headphone|słuchawk/i.test(dev.name)
          ? '\u{F025}'
          : volumeIcons[Math.min(2, Math.floor(dev.volume / 34))];
        el.textContent = dev.isMuted ? '\u{F075F}' : `${glyph} ${Math.round(dev.volume)}%`;
        el.title = `Volume : ${Math.round(dev.volume)}%`;
      });
      $('volume').onwheel = e => {
        const dev = audio.output?.defaultPlaybackDevice;
        if (!dev) return;
        const step = e.deltaY < 0 ? 1 : -1;
        audio.output.setVolume(Math.max(0, Math.min(100, Math.round(dev.volume) + step)));
      };
      $('volume').onclick = () => {
        const dev = audio.output?.defaultPlaybackDevice;
        if (dev) audio.output.setMute(!dev.isMuted);
      };

      // Battery. Reading it fails now and then (e.g. while plugging in the
      // charger); those errors keep the last value. It is only hidden on
      // machines that never reported a battery.
      const battery = zebar.createProvider({ type: 'battery' });
      const batteryIcons = ['\u{F244}', '\u{F243}', '\u{F242}', '\u{F241}', '\u{F240}'];
      let hasBattery = false;
      battery.onOutput(bat => {
        const pct = Math.round(bat.chargePercent);
        if (!Number.isFinite(pct)) return;
        hasBattery = true;
        const el = $('battery');
        el.hidden = false;
        const glyph = bat.isCharging ? '\u{F0084}' : batteryIcons[Math.min(4, Math.floor(pct / 20))];
        el.textContent = ` ${glyph} ${pct}%`;
      });
      battery.onError(() => {
        if (!hasBattery) $('battery').hidden = true;
      });

      // VPN: Windows' built-in VPN profiles (Settings > Network > VPN).
      // Click to unfold them, pick one to connect (dropping the current one),
      // pick the connected one to disconnect. A connected profile shows up
      // as a network interface named after it.
      const vpn = $('vpn');
      const vpnList = vpn.querySelector('.vpn-list');
      const vpnToggle = vpn.querySelector('.vpn-toggle');
      const network = zebar.createProvider({ type: 'network', refreshInterval: 3000 });
      const listVpns =
        '[Console]::OutputEncoding = [Text.Encoding]::UTF8; ' +
        '@(Get-VpnConnection -ErrorAction Ignore; Get-VpnConnection -AllUserConnection -ErrorAction Ignore) | ' +
        'ForEach-Object Name | ConvertTo-Json -Compress';
      let vpnProfiles = [];
      let vpnConnected = null;

      async function loadVpnProfiles() {
        const { stdout } = await zebar.shellExec('powershell', ['-NoProfile', '-Command', listVpns]);
        vpnProfiles = [...new Set([].concat(stdout.trim() ? JSON.parse(stdout) : []))];
        renderVpn();
      }

      function renderVpn() {
        const up = new Set((network.output?.interfaces ?? []).map(i => i.friendlyName));
        vpnConnected = vpnProfiles.find(name => up.has(name)) ?? null;
        vpn.hidden = vpnProfiles.length === 0;
        vpn.classList.toggle('connected', vpnConnected !== null);
        vpnToggle.textContent = vpnConnected ? `\u{F0582} ${vpnConnected}` : '\u{F0582}';
        vpnList.replaceChildren(
          ...vpnProfiles.map(name => {
            const button = document.createElement('button');
            button.dataset.vpn = name;
            button.textContent = name;
            button.classList.toggle('active', name === vpnConnected);
            return button;
          }),
        );
      }

      async function switchVpn(name) {
        const current = vpnConnected;
        if (current) await zebar.shellExec('rasdial', [current, '/disconnect']);
        if (name !== current) {
          const { code } = await zebar.shellExec('rasdial', [name]);
          // Without saved credentials rasdial fails; Windows' own dialog asks.
          if (code !== 0) await zebar.shellExec('rasphone', ['-d', name]);
        }
        network.restart();
      }

      network.onOutput(renderVpn);
      vpn.onclick = e => {
        const name = e.target.closest('[data-vpn]')?.dataset.vpn;
        if (name === undefined) {
          if (vpn.classList.toggle('open')) loadVpnProfiles().catch(console.error);
          return;
        }
        vpn.classList.remove('open');
        switchVpn(name).catch(console.error);
      };
      vpn.onmouseleave = () => vpn.classList.remove('open');
      loadVpnProfiles().catch(console.error);

      // Power menu: click the icon to unfold the actions inline (a dropdown
      // can't leave the bar's window).
      const powerCommands = {
        suspend: [
          'powershell',
          [
            '-NoProfile',
            '-Command',
            "Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.Application]::SetSuspendState('Suspend', $false, $false)",
          ],
        ],
        hibernate: ['shutdown', ['/h']],
        shutdown: ['shutdown', ['/s', '/t', '0']],
        reboot: ['shutdown', ['/r', '/t', '0']],
      };
      const power = $('power');
      power.onclick = e => {
        const action = e.target.closest('[data-action]')?.dataset.action;
        if (!action) {
          power.classList.toggle('open');
          return;
        }
        power.classList.remove('open');
        zebar.shellExec(...powerCommands[action]).catch(console.error);
      };
      power.onmouseleave = () => power.classList.remove('open');
    </script>
  </body>
</html>
